name: Dynamic Cascading Branch Sync

on:
  pull_request:
    types: [closed]
    branches:
      - '**'   # listen to all branches

jobs:
  sync:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Read branch flow
        id: branch_flow
        run: |
          SRC="${{ github.event.pull_request.base.ref }}"
          echo "Merged into: $SRC"

          FLOW=$(jq -r --arg b "$SRC" '.[$b] | join(",")' .github/sync-flow.json)
          if [ "$FLOW" != "null" ]; then
            echo "flow=$FLOW" >> $GITHUB_OUTPUT
          fi

      - name: Trigger PRs
        if: ${{ steps.branch_flow.outputs.flow }}
        run: |
          SRC="${{ github.event.pull_request.base.ref }}"
          IFS=',' read -ra TARGETS <<< "${{ steps.branch_flow.outputs.flow }}"

          for DEST in "${TARGETS[@]}"; do
            echo "Creating PR: $SRC → $DEST"
          done
